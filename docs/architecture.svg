<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 665" width="1200" height="665" role="img" aria-label="System overview: the ESP32 charger switches one Somfy shade at a time onto the charge supply and measures it; Home Assistant shows it and pauses it when a shade it is charging has to move; Bond drives the shades over Somfy RTS.">
<style>
.bx{fill:#F7FAFB;stroke:#8FA3AE;stroke-width:1.5}
.hl{fill:#F3EEFB;stroke:#7A45B8;stroke-width:1.8}
.t{fill:#18232C;font-family:"IBM Plex Sans",Helvetica,Arial,sans-serif;font-size:16px;font-weight:600}
.s{fill:#5B6B76;font-family:"IBM Plex Sans",Helvetica,Arial,sans-serif;font-size:12.5px}
.m{fill:#5B6B76;font-family:"IBM Plex Mono",Menlo,Consolas,monospace;font-size:11.5px}
.chg{stroke:#7A45B8;stroke-width:3;fill:none}
.data{stroke:#1F7F98;stroke-width:2;fill:none}
.rf{stroke:#C8372D;stroke-width:2;fill:none;stroke-dasharray:7 5}
.pause{stroke:#B8641A;stroke-width:2;fill:none;stroke-dasharray:3 4}
.lbl{font-family:"IBM Plex Sans",Helvetica,Arial,sans-serif;font-size:12px;font-weight:600}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F7F98"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C8372D"/></marker>
  <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8641A"/></marker>
  <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7A45B8"/></marker>
</defs>
<rect width="1200" height="665" fill="#FFFFFF"/>

<!-- charge supply -->
<rect class="bx" x="40" y="40" width="250" height="90" rx="10"/>
<text class="t" x="58" y="70">Charge supply</text>
<text class="s" x="58" y="92">13.3 V, current-limited</text>
<text class="s" x="58" y="110">(the shades' own charger)</text>

<!-- charger -->
<rect class="hl" x="40" y="190" width="330" height="250" rx="12"/>
<text class="t" x="58" y="220">ESP32 shade charger</text>
<text class="s" x="58" y="244">XIAO ESP32-C6 · ESPHome</text>
<text class="s" x="58" y="266">INA226 + shunt: current &amp; voltage</text>
<text class="s" x="58" y="288">8-channel relay board: one shade at a time</text>
<text class="s" x="58" y="318">• queue: checks, then charges, lowest V first</text>
<text class="s" x="58" y="338">• charge window (02:00–08:00)</text>
<text class="s" x="58" y="358">• per-shade history &amp; learning</text>
<text class="s" x="58" y="378">• faults latch: overcurrent, supply, sensor</text>
<text class="s" x="58" y="398">• own web page with a per-shade table</text>
<text class="m" x="58" y="424">shade-charger.local</text>

<path class="chg" d="M165 130 V 186" marker-end="url(#c)"/>
<text class="lbl" x="175" y="164" fill="#7A45B8">charge path</text>

<!-- shades -->
<rect class="bx" x="560" y="190" width="300" height="250" rx="12"/>
<text class="t" x="578" y="220">8 Somfy Li-ion shades</text>
<text class="s" x="578" y="244">RTS motors, built-in pack + controller</text>
<text class="s" x="578" y="266">the pack ends its own charge</text>
<text class="s" x="578" y="288">(current steps from ~0.33 A to 0)</text>
<text class="s" x="578" y="318">a motor won't move while its charger</text>
<text class="s" x="578" y="338">is connected → the charger pauses</text>
<text class="s" x="578" y="368">16/4 runs · 2 A fuse per channel</text>
<text class="s" x="578" y="388">run resistance 0.5–1.1 Ω (measured,</text>
<text class="s" x="578" y="408">corrected per shade)</text>

<path class="chg" d="M370 300 H 556" marker-end="url(#c)"/>
<text class="lbl" x="392" y="290" fill="#7A45B8">one shade at a time</text>

<!-- home assistant -->
<rect class="bx" x="40" y="500" width="330" height="110" rx="12"/>
<text class="t" x="58" y="530">Home Assistant</text>
<text class="s" x="58" y="552">dashboard mirrors the charger page</text>
<text class="s" x="58" y="572">per-shade current / voltage sensors</text>
<text class="s" x="58" y="592">pause-for-a-move automation</text>

<path class="data" d="M205 440 V 496" marker-end="url(#a)" marker-start="url(#a)"/>
<text class="lbl" x="215" y="474" fill="#1F7F98">ESPHome API (Wi-Fi)</text>

<!-- bond -->
<rect class="bx" x="560" y="500" width="300" height="110" rx="12"/>
<text class="t" x="578" y="530">Bond bridge</text>
<text class="s" x="578" y="552">sends Somfy RTS (433.42 MHz)</text>
<text class="s" x="578" y="572">one-way: no position or battery back</text>

<path class="data" d="M370 555 H 556" marker-end="url(#a)"/>
<text class="lbl" x="392" y="545" fill="#1F7F98">cover commands</text>
<path class="rf" d="M710 500 V 444" marker-end="url(#r)"/>
<text class="lbl" x="720" y="476" fill="#C8372D">RTS radio</text>

<!-- pause flow -->
<rect class="bx" x="930" y="190" width="240" height="250" rx="12"/>
<text class="t" x="948" y="220">Moving a shade</text>
<text class="t" x="948" y="240">that is charging</text>
<text class="s" x="948" y="270">1. a cover command targets the</text>
<text class="s" x="948" y="288">    shade on the charger</text>
<text class="s" x="948" y="312">2. HA turns on "Pause charging":</text>
<text class="s" x="948" y="330">    relay opens, run frozen</text>
<text class="s" x="948" y="354">3. HA re-sends the command,</text>
<text class="s" x="948" y="372">    the shade moves</text>
<text class="s" x="948" y="396">4. after 2 min the charge resumes</text>
<text class="s" x="948" y="414">    where it left off</text>
<path class="pause" d="M1050 440 V 640 H 205 V 616" marker-end="url(#p)"/>
<text class="lbl" x="880" y="634" fill="#B8641A">pause + re-send</text>

<!-- legend -->
<g transform="translate(400,40)">
  <path class="chg" d="M0 10 H 34"/><text class="s" x="42" y="14">charge current</text>
  <path class="data" d="M160 10 H 194"/><text class="s" x="202" y="14">network</text>
  <path class="rf" d="M290 10 H 324"/><text class="s" x="332" y="14">Somfy RTS radio</text>
  <path class="pause" d="M470 10 H 504"/><text class="s" x="512" y="14">pause flow</text>
</g>
</svg>
