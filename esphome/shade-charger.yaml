script:
  # Append to the queue (skipping a duplicate: a shade already queued to charge,
  # or already queued for a check) and publish it.
  - id: q_add
    mode: queued
    max_runs: 20
    parameters:
      p: int
      kind: int
    then:
      - lambda: |-
          if (p < 0 || p > 7 || id(qn) >= 16) return;
          for (int i = 0; i < id(qn); i++) {
            if (id(qs)[i] != p) continue;
            // A manual charge for a shade whose automatic charge is waiting for
            // the window: promote that entry to "now" rather than skip it.
            if (kind == 0 && id(qk)[i] == 2) { id(qk)[i] = 0; id(q_publish)->execute(); return; }
            if ((kind == 1) == (id(qk)[i] == 1)) return;     // same sort of job already queued
          }
          // Checks go IN FRONT of the waiting automatic charges (behind manual
          // ones, which run at once anyway): a check run reads every shade before
          // any automatic charge starts, and each reading re-sorts those charges.
          int at = id(qn);
          if (kind == 1)   // checks: ahead of every waiting charge (Charge Now) or of the automatic ones
            for (int i = 0; i < id(qn); i++)
              if (id(qk)[i] == 2 || (id(check_front) && id(qk)[i] == 0)) { at = i; break; }
          for (int i = id(qn); i > at; i--) { id(qs)[i] = id(qs)[i - 1]; id(qk)[i] = id(qk)[i - 1]; }
          id(qs)[at] = p; id(qk)[at] = kind; id(qn)++;
          id(q_publish)->execute();

  # After a check: drop the shade's waiting automatic charge, then -- if the new
  # reading is under "Charge below" -- insert it again among the automatic
  # charges, lowest voltage first, behind any checks still to run. So the charge
  # order builds up live as a check run goes. Manual charges are left alone.
  - id: q_place_auto
    mode: queued
    max_runs: 20
    parameters:
      p: int
    then:
      - lambda: |-
          if (p < 0 || p > 7) return;
          const int kq = id(run_manual) ? 0 : 2;   // Charge Now's charges run at once
          for (int i = 0; i < id(qn); ) {
            if (id(qs)[i] == p && (id(qk)[i] == 2 || (kq == 0 && id(qk)[i] == 0))) {
              for (int k = i; k < id(qn) - 1; k++) { id(qs)[k] = id(qs)[k + 1]; id(qk)[k] = id(qk)[k + 1]; }
              id(qn)--;
            } else i++;
          }
          float v = id(chk_v)[p];
          bool manual = false;
          if (kq == 2) for (int i = 0; i < id(qn); i++) if (id(qs)[i] == p && id(qk)[i] == 0) manual = true;
          if (!(v > 0 && v < id(charge_below_v).state) || manual || id(qn) >= 16) { id(q_publish)->execute(); return; }
          int at = 0;
          for (int i = 0; i < id(qn); i++) if (id(qk)[i] == 1) at = i + 1;     // behind the checks
          while (at < id(qn) && !(id(qk)[at] == kq && id(chk_v)[id(qs)[at]] > v)) at++;
          for (int i = id(qn); i > at; i--) { id(qs)[i] = id(qs)[i - 1]; id(qk)[i] = id(qk)[i - 1]; }
          id(qs)[at] = p; id(qk)[at] = kq; id(qn)++;
          id(q_publish)->execute();

  # "Next auto check": the first Auto Charge Start hour at least (Auto check
  # every) days after the last check run -- scheduled or Charge Now.
  - id: next_check_update
    mode: queued
    max_runs: 5
    then:
      - lambda: |-
          int days = (int) id(auto_days).state;
          auto now = id(sntp_time).now();
          if (days <= 0) { id(next_check).publish_state("off"); return; }
          if (!now.is_valid()) { id(next_check).publish_state("waiting for the time"); return; }
          uint32_t from = id(last_auto) ? id(last_auto) + (uint32_t) days * 86400u - 3600u : now.timestamp;
          if (from < now.timestamp) from = now.timestamp;
          uint32_t c = (from / 3600u + 1u) * 3600u;            // next whole hour
          if (from % 3600u == 0) c = from;
          for (int i = 0; i < 24 * 100; i++, c += 3600u) {
            auto lt = ESPTime::from_epoch_local(c);
            if (lt.hour == (int) id(auto_hour).state) {
              id(next_check).publish_state(lt.strftime("%a %b %d %H:%M"));
              return;
            }
          }
          id(next_check).publish_state("unknown");

  # The "Queue" text: "Bedroom 3: charge; Den: charge from 02:00; Den: check".
  - id: q_publish
    mode: queued
    max_runs: 20
    then:
      - lambda: |-
          static const char *names[8] = {"${shade1}", "${shade2}", "${shade3}", "${shade4}",
                                         "${shade5}", "${shade6}", "${shade7}", "${shade8}"};
          auto wt = id(sntp_time).now();
          int wa = (int) id(auto_hour).state, wu = (int) id(until_hour).state;
          bool win = !wt.is_valid() || wa == wu ||
                     (wa < wu ? (wt.hour >= wa && wt.hour < wu) : (wt.hour >= wa || wt.hour < wu));
          if (id(qn) <= 0) { id(queue_ts).publish_state("empty"); return; }
          std::string out;
          for (int i = 0; i < id(qn); i++) {
            int p = id(qs)[i];
            if (p < 0 || p > 7) continue;
            if (!out.empty()) out += "; ";
            out += names[p];
            if (id(qk)[i] == 1) out += ": check";
            else if (id(qk)[i] == 2 && !win) { char b[24]; snprintf(b, sizeof(b), ": charge from %02d:00", wa); out += b; }
            else out += ": charge";
          }
          id(queue_ts).publish_state(out);

  # Append one charge to a shade's history ring and re-learn that shade.
  - id: history_push
    mode: queued
    max_runs: 16
    parameters:
      p: int
      epoch: int
      ah: float
      v: float
      mins: int
      res: int
    then:
      - lambda: |-
          if (p < 0 || p > 7) return;
          int i = p * 8 + id(h_head)[p];
          id(h_epoch)[i] = (uint32_t) epoch;
          id(h_ah)[i] = ah;
          id(h_v)[i] = v;
          id(h_min)[i] = (uint16_t) mins;
          id(h_res)[i] = (uint8_t) res;
          id(h_head)[p] = (id(h_head)[p] + 1) % 8;
          id(learn_update)->execute(p);

  # What the history says about one shade. Display only: nothing here changes
  # how or when a shade is charged.
  #   capacity  >= the most any one charge has taken (a floor until a shade is
  #               charged from empty)
  #   use/day   Ah of a full charge / days since the previous full charge, over
  #               pairs at least a day apart with no partial charge between
  #   now ~%    capacity minus use/day x days since the last full charge
  #   V->Ah     straight line through (start V, Ah) of full charges, once there
  #               are 3+ of them spread over at least 0.15 V
  - id: learn_update
    mode: parallel
    parameters:
      p: int
    then:
      - lambda: |-
          text_sensor::TextSensor *ts[8] = {id(lrn0), id(lrn1), id(lrn2), id(lrn3),
                                           id(lrn4), id(lrn5), id(lrn6), id(lrn7)};
          if (p < 0 || p > 7) return;
          auto &E = id(h_epoch); auto &A = id(h_ah); auto &V = id(h_v); auto &R = id(h_res);
          int idx[8], n = 0;
          for (int k = 0; k < 8; k++) {             // oldest -> newest
            int i = p * 8 + (id(h_head)[p] + k) % 8;
            if (E[i]) idx[n++] = i;
          }
          id(fit_ok)[p] = false;
          if (n == 0) {
            std::string o = "no charges yet";
            if (id(chk_epoch)[p]) {
              char c[64];
              std::string w = ESPTime::from_epoch_local(id(chk_epoch)[p]).strftime("%b %d %H:%M");
              if (id(chk_v)[p] < 0) snprintf(c, sizeof(c), " - checked %s: no draw", w.c_str());
              else snprintf(c, sizeof(c), " - checked %s: %.2f V", w.c_str(), id(chk_v)[p]);
              o += c;
            }
            ts[p]->publish_state(o);
            return;
          }

          // Merge a top-up into the charge it follows: a full charge within 6 h
          // of a previous full one is the same fill (the pack takes a short
          // top-up whenever it is reconnected), not a new charge.
          uint32_t sE[8]; float sA[8], sV[8]; uint8_t sR[8]; int ns = 0;
          for (int k = 0; k < n; k++) {
            int i = idx[k];
            uint8_t ri = R[i] == 8 ? 1 : R[i];   // cable-limited counts as full
            if (ns > 0 && ri == 1 && sR[ns - 1] == 1 && E[i] - sE[ns - 1] < 6 * 3600u) {
              sA[ns - 1] += A[i]; sE[ns - 1] = E[i];
              continue;
            }
            sE[ns] = E[i]; sA[ns] = A[i]; sV[ns] = V[i]; sR[ns] = ri; ns++;
          }

          float cap = 0, sum_ah = 0, sum_d = 0;
          int prev = -1;
          uint32_t last_full = 0;
          float sv = 0, sa = 0, svv = 0, sva = 0, vmin = 99, vmax = 0;
          int nfit = 0;
          for (int k = 0; k < ns; k++) {
            bool full = sR[k] == 1, capped = sR[k] == 3;
            if (full || capped) cap = std::max(cap, sA[k]);
            if (!full) { if (sA[k] > 0.01f) prev = -1; continue; }
            if (prev >= 0) {
              float d = (sE[k] - sE[prev]) / 86400.0f;
              if (d >= 1.0f) { sum_ah += sA[k]; sum_d += d; }
            }
            prev = k;
            last_full = sE[k];
            if (sV[k] > 0) {
              sv += sV[k]; sa += sA[k]; svv += sV[k] * sV[k]; sva += sV[k] * sA[k]; nfit++;
              vmin = std::min(vmin, sV[k]); vmax = std::max(vmax, sV[k]);
            }
          }
          if (nfit >= 3 && vmax - vmin >= 0.15f) {
            float den = nfit * svv - sv * sv;
            if (std::fabs(den) > 1e-6f) {
              id(fit_b)[p] = (nfit * sva - sv * sa) / den;
              id(fit_a)[p] = (sa - id(fit_b)[p] * sv) / nfit;
              id(fit_ok)[p] = true;
            }
          }

          std::string out;
          char b[64];
          // Only completed charges count; runs that were stopped, dropped out or
          // drew nothing are partial and say nothing about the pack.
          int nfull = 0;
          for (int k = 0; k < ns; k++) if (sR[k] == 1 || sR[k] == 3) nfull++;
          if (nfull == 0) out += "no completed charge yet";
          else { snprintf(b, sizeof(b), "%d full charge%s", nfull, nfull == 1 ? "" : "s"); out += b; }
          // A floor on capacity: the most one charge has put in. It only becomes
          // the real capacity once a shade is charged from empty.
          if (cap > 0) { snprintf(b, sizeof(b), " - largest %.2f Ah", cap); out += b; }
          float rate = sum_d >= 1.0f ? sum_ah / sum_d : 0;
          if (rate > 0) {
            snprintf(b, sizeof(b), " - uses %.3f Ah/day", rate); out += b;
            auto t = id(sntp_time).now();
            if (cap > 0 && last_full && t.is_valid() && t.timestamp > last_full) {
              float used = rate * (t.timestamp - last_full) / 86400.0f;
              float pct = std::min(100.0f, std::max(0.0f, 100.0f * (1.0f - used / cap)));
              float left = std::max(0.0f, (cap - used) / rate);
              snprintf(b, sizeof(b), " - now ~%.0f%%, empty in ~%.0f d", pct, left); out += b;
            }
          } else {
            out += " - use per day known after its next full charge";
          }
          if (id(fit_ok)[p]) {
            snprintf(b, sizeof(b), " - V->Ah fit from %d", nfit); out += b;
          }
          if (id(chk_epoch)[p]) {
            std::string w = ESPTime::from_epoch_local(id(chk_epoch)[p]).strftime("%b %d %H:%M");
            if (id(chk_v)[p] < 0) snprintf(b, sizeof(b), " - checked %s: no draw", w.c_str());
            else snprintf(b, sizeof(b), " - checked %s: %.2f V", w.c_str(), id(chk_v)[p]);
            out += b;
          }
          ts[p]->publish_state(out);

  # Latch a fault: everything off, queue dropped, nothing starts until Clear fault.
  - id: latch_fault
    parameters:
      code: int
    then:
      - lambda: |-
          static const char *why[] = {"unknown", "overcurrent", "current sensor not reading",
                                      "watchdog tripped", "supply voltage low",
                                      "supply voltage high"};
          static const char *names[8] = {"${shade1}", "${shade2}", "${shade3}", "${shade4}",
                                         "${shade5}", "${shade6}", "${shade7}", "${shade8}"};
          id(halted) = true;
          id(fault_code) = code;
          id(qn) = 0; id(run_mask) = 0;
          id(q_publish)->execute();
          char st[120];
          int fs = id(fault_shade);
          if (fs >= 0 && fs < 8)
            snprintf(st, sizeof(st), "FAULT - %s on %s, press Clear fault",
                     why[(code < 0 || code > 5) ? 0 : code], names[fs]);
          else
            snprintf(st, sizeof(st), "FAULT - %s (charger), press Clear fault",
                     why[(code < 0 || code > 5) ? 0 : code]);
          id(status).publish_state(st);
          ESP_LOGE("charger", "%s", st);
  # Rebuild one port's "last charge" line from the persisted globals.
  - id: port_summary_update
    mode: parallel
    parameters:
      p: int
    then:
      - lambda: |-
          static const char *res[] = {"never charged", "full", "no draw", "time cap",
                                      "OVERCURRENT", "stopped", "sensor fault",
                                      "DROPPED OUT", "full (cable-limited)",
                                      "stopped at window end"};
          text_sensor::TextSensor *ts[8] = {id(sum0), id(sum1), id(sum2), id(sum3),
                                           id(sum4), id(sum5), id(sum6), id(sum7)};
          if (p < 0 || p > 7) return;
          uint8_t r = id(last_res)[p];
          if (r == 0 || r > 9) { ts[p]->publish_state("never charged"); return; }
          std::string when = "time unknown";
          if (id(last_epoch)[p]) when = ESPTime::from_epoch_local(id(last_epoch)[p]).strftime("%b %d %H:%M");
          char buf[112];
          int n = snprintf(buf, sizeof(buf), "%s - %s - %.3f Ah - %u min", when.c_str(), res[r],
                           id(last_ah)[p], (unsigned) id(last_min)[p]);
          if (id(last_v)[p] > 0 && n > 0 && n < (int) sizeof(buf))
            n += snprintf(buf + n, sizeof(buf) - n, " - start %.2f V", id(last_v)[p]);
          if (id(last_endv)[p] > 0 && n > 0 && n < (int) sizeof(buf))
            snprintf(buf + n, sizeof(buf) - n, " - end %.2f V", id(last_endv)[p]);
          ts[p]->publish_state(buf);

interval:
  # The charging state machine.
  - interval: 2s
    then:
      - lambda: |-
          static const char *names[8] = {"${shade1}", "${shade2}",
              "${shade3}", "${shade4}", "${shade5}", "${shade6}",
              "${shade7}", "${shade8}"};
          switch_::Switch *ports[8] = {id(relay1), id(relay2), id(relay3), id(relay4),
                                      id(relay5), id(relay6), id(relay7), id(relay8)};
          const uint32_t now = millis();
          const float dt_h = id(last_tick) ? (now - id(last_tick)) / 3600000.0f : 0.0f;
          id(last_tick) = now;
          const float a = id(cur_a).has_state() ? id(cur_a).state : NAN;

          auto all_off = [&]() { for (auto *s : ports) s->turn_off(); };
          auto finish = [&](uint8_t result) {
            int p = id(active);
            all_off();
            if (p >= 0) {
              auto t = id(sntp_time).now();
              id(last_epoch)[p] = t.is_valid() ? t.timestamp : 0;
              id(last_ah)[p] = id(sess_ah);
              id(last_min)[p] = (uint16_t) ((now - id(t_start)) / 60000u);
              id(last_res)[p] = result;
              id(last_v)[p] = id(sess_v);
              id(last_endv)[p] = (result != 1 && result != 2 && id(pre_v) > 0) ? id(pre_v) : 0;
              id(port_summary_update)->execute(p);
              // Not history: nothing delivered, or a charge cut by the window (it
              // resumes as a new charge next window).
              if (result != 9 && !((result == 2 || result == 5) && id(sess_ah) < 0.01f))
                id(history_push)->execute(p, (int) id(last_epoch)[p], id(sess_ah), id(sess_v),
                                          (int) id(last_min)[p], (int) result);
              ESP_LOGI("charger", "%s finished: result %u, %.3f Ah", names[p], result, id(sess_ah));
              // Results 4-7 publish their own (fault / Stopped / dropped-out) text.
              char m[110] = "";
              unsigned mins = (unsigned) id(last_min)[p];
              if (result == 1)
                snprintf(m, sizeof(m), "%s: full - %.3f Ah in %u min", names[p], id(sess_ah), mins);
              else if (result == 8)
                snprintf(m, sizeof(m), "%s: full (cable-limited) - %.3f Ah in %u min", names[p], id(sess_ah), mins);
              else if (result == 3)
                snprintf(m, sizeof(m), "%s: TIME CAP - %.3f Ah in %u min, still charging", names[p], id(sess_ah), mins);
              else if (result == 2)
                snprintf(m, sizeof(m), "%s: NO DRAW at %.2f V - check fuse, wiring and plug", names[p],
                         id(bus_v).has_state() ? id(bus_v).state : 0.0f);
              if (m[0]) id(status).publish_state(m);
              id(result_shown) = true;
            }
            id(active) = -1;
            id(phase) = 3;
            id(t_phase) = now;
          };

          // A check that does not turn into a charge: relay off, remember the
          // voltage, no charge record.
          auto end_check = [&](bool record) {
            int p = id(active);
            all_off();
            if (p >= 0 && record) {
              auto t = id(sntp_time).now();
              id(chk_epoch)[p] = t.is_valid() ? t.timestamp : 0;
              id(chk_v)[p] = id(sess_v);
              id(learn_update)->execute(p);
              ESP_LOGI("charger", "%s checked: %.2f V", names[p], id(sess_v));
            }
            id(result_shown) = true;
            id(active) = -1;
            id(is_check) = false;
            id(phase) = 3;
            id(t_phase) = now;
          };

          if (id(stop_req)) {
            id(stop_req) = false;
            int sp = id(active), sk = id(is_check) ? 1 : id(active_kind);
            if (sp >= 0 && id(is_check)) end_check(false);
            else if (sp >= 0) finish(5); else all_off();
            // The stopped job goes back to the front, so resuming loses nothing.
            if (sp >= 0 && id(qn) < 16) {
              for (int i = id(qn); i > 0; i--) { id(qs)[i] = id(qs)[i - 1]; id(qk)[i] = id(qk)[i - 1]; }
              id(qs)[0] = sp; id(qk)[0] = sk; id(qn)++;
            }
            id(held) = true;
            id(q_publish)->execute();
            char m[96];
            snprintf(m, sizeof(m), "Stopped - queue held (%d queued), Charge Now resumes", id(qn));
            id(status).publish_state(m);
            id(result_shown) = true;
            return;
          }

          // Pause: relay open and everything frozen until it ends (switch off
          // or the "Pause minutes" timer). Stop above still works while paused.
          if (id(paused) && (int32_t) (now - id(pause_until)) >= 0) {
            id(paused) = false;
            id(pause_sw)->publish_state(false);
          }
          if (id(paused)) {
            if (!id(was_paused)) {
              all_off();
              id(was_paused) = true;
              id(pause_t0) = now;
              char ps[96];
              if (id(active) >= 0) snprintf(ps, sizeof(ps), "%s: paused for a shade move", names[id(active)]);
              else snprintf(ps, sizeof(ps), "Paused");
              id(status).publish_state(ps);
              id(pause_sw)->publish_state(true);
            }
            return;
          }
          if (id(was_paused)) {   // resume where it left off
            id(was_paused) = false;
            id(pause_sw)->publish_state(false);
            int p = id(active);
            if (p >= 0 && id(active_relay) >= 0) {
              id(t_start) += now - id(pause_t0);      // Max hours excludes the pause
              id(below_since) = 0;
              id(stall_since) = 0;
              ports[id(active_relay)]->turn_on();
              if (id(phase) == 1) id(t_start) = now;  // redo the settle
              else if (id(phase) == 2) { id(phase) = 4; id(t_phase) = now; }
              char ps[96];
              snprintf(ps, sizeof(ps), "%s: resuming", names[p]);
              id(status).publish_state(ps);
            } else if (!id(result_shown)) {
              id(status).publish_state("Idle");
            }
            return;
          }

          // Charge window over: an AUTOMATIC charge stops and goes back to the
          // front of the queue, to resume at the next window.
          if (id(active) >= 0 && id(active_kind) == 2 && !id(is_check) &&
              (id(phase) == 1 || id(phase) == 2 || id(phase) == 4)) {
            auto wt = id(sntp_time).now();
            int wa = (int) id(auto_hour).state, wu = (int) id(until_hour).state;
            bool win = !wt.is_valid() || wa == wu ||
                       (wa < wu ? (wt.hour >= wa && wt.hour < wu) : (wt.hour >= wa || wt.hour < wu));
            if (!win) {
              int p = id(active);
              finish(9);
              if (id(qn) < 16) {
                for (int i = id(qn); i > 0; i--) { id(qs)[i] = id(qs)[i - 1]; id(qk)[i] = id(qk)[i - 1]; }
                id(qs)[0] = p; id(qk)[0] = 2; id(qn)++;
              }
              id(q_publish)->execute();
              char m[96];
              snprintf(m, sizeof(m), "%s: charge window ended, resumes at %02d:00", names[p], wa);
              id(status).publish_state(m);
              return;
            }
          }

          // Overcurrent in ANY active phase: stop and latch a fault.
          if (id(active) >= 0 && !std::isnan(a) && a > id(overcurrent_a).state) {
            id(is_check) = false;
            id(fault_shade) = id(active);
            finish(4);
            id(latch_fault)->execute(1);
            return;
          }

          char st[96];
          switch (id(phase)) {
            case 0: {  // idle: start the next queued port
              if (id(halted) || id(held)) return;
              // Check run finished (no checks left in the queue): record the summary.
              // (Each shade's charge was queued, in voltage order, as its check ended.)
              bool checks_left = false;
              for (int i = 0; i < id(qn); i++) if (id(qk)[i] == 1) checks_left = true;
              if (id(run_mask) && !checks_left) {
                int sorted[8], n = 0, checked = 0;
                for (int k = 0; k < 8; k++) {
                  if (!(id(run_mask) & (1 << k))) continue;
                  float cv = id(chk_v)[k];
                  if (cv > 0) checked++;
                  if (cv > 0 && cv < id(charge_below_v).state) {
                    int j = n++;                                   // insertion sort by voltage
                    while (j > 0 && id(chk_v)[sorted[j - 1]] > cv) { sorted[j] = sorted[j - 1]; j--; }
                    sorted[j] = k;
                  }
                }
                id(run_mask) = 0;   // charges were already queued as each check finished
                std::string sum;
                auto t = id(sntp_time).now();
                if (t.is_valid()) sum = t.strftime("%b %d %H:%M") + " - ";
                sum += "read " + std::to_string(checked) + ", ";
                if (n == 0) {
                  char b[48]; snprintf(b, sizeof(b), "none under %.2f V, nothing to charge", id(charge_below_v).state);
                  sum += b;
                } else {
                  sum += "charging " + std::to_string(n) + ", lowest first: ";
                  for (int k = 0; k < n; k++) {
                    char b[48];
                    snprintf(b, sizeof(b), "%s%s (%.2f V)", k ? ", " : "", names[sorted[k]], id(chk_v)[sorted[k]]);
                    sum += b;
                  }
                }
                strncpy(id(last_run_txt).data(), sum.c_str(), id(last_run_txt).size() - 1);
                id(last_run_txt)[id(last_run_txt).size() - 1] = 0;
                id(last_run).publish_state(sum);
                ESP_LOGI("charger", "Check done - %s", sum.c_str());
                id(status).publish_state("Check done - " + sum);
                id(result_shown) = true;
                return;
              }
              if (id(qn) == 0) return;
              // First entry that may run now: automatic charges wait for the window.
              auto wt = id(sntp_time).now();
              int wa = (int) id(auto_hour).state, wu = (int) id(until_hour).state;
              bool win = !wt.is_valid() || wa == wu ||
                         (wa < wu ? (wt.hour >= wa && wt.hour < wu) : (wt.hour >= wa || wt.hour < wu));
              int qi = -1;
              for (int i = 0; i < id(qn) && qi < 0; i++) if (id(qk)[i] != 2 || win) qi = i;
              if (qi < 0) {
                char w[96];
                snprintf(w, sizeof(w), "Waiting for the charge window (%02d:00-%02d:00), %d queued", wa, wu, id(qn));
                if (id(status).state != w) { id(status).publish_state(w); id(result_shown) = true; }
                return;
              }
              // Supply check with every relay open: is the charger there, and the right one?
              const float v = id(bus_v).has_state() ? id(bus_v).state : NAN;
              id(fault_shade) = -1;
              if (std::isnan(v) || std::isnan(a)) { id(latch_fault)->execute(2); return; }
              if (v < id(supply_min_v).state) { id(latch_fault)->execute(4); return; }
              if (v > id(supply_max_v).state) { id(latch_fault)->execute(5); return; }
              // Take entry qi off the queue. Which relay a shade is on comes from
              // the "Relay N shade" selects.
              int p = id(qs)[qi], kind = id(qk)[qi];
              for (int i = qi; i < id(qn) - 1; i++) { id(qs)[i] = id(qs)[i + 1]; id(qk)[i] = id(qk)[i + 1]; }
              id(qn)--;
              id(q_publish)->execute();
              bool chk = kind == 1;
              id(active_kind) = kind;
              select::Select *map[8] = {id(rs1), id(rs2), id(rs3), id(rs4),
                                        id(rs5), id(rs6), id(rs7), id(rs8)};
              int r = -1;
              for (int k = 0; k < 8 && r < 0; k++) {
                auto ix = map[k]->active_index();
                if (ix.has_value() && (int) *ix == p + 1) r = k;
              }
              if (r < 0) {
                snprintf(st, sizeof(st), "%s: no relay assigned, skipped", names[p]);
                id(status).publish_state(st);
                ESP_LOGW("charger", "%s", st);
                return;
              }
              id(active) = p;
              id(result_shown) = false;
              id(is_check) = chk;
              id(sess_ah) = 0;
              id(sess_v) = 0;
              id(peak_a) = 0;
              id(below_since) = 0;
              id(pre_a) = 0; id(pre_v) = 0;
              id(stall_a) = 0; id(stall_since) = 0;
              id(t_start) = now;
              id(phase) = 1;
              id(active_relay) = r;
              ports[r]->turn_on();
              id(expected).publish_state("");
              snprintf(st, sizeof(st), chk ? "%s: checking" : "%s: starting", names[p]);
              id(status).publish_state(st);
              return;
            }
            case 1: {  // settle: does it draw at all?
              if (!std::isnan(a)) id(sess_ah) += a * dt_h;
              if (now - id(t_start) < 30000u) return;   // Settle: fixed 30 s
              if (id(bus_v).has_state() && !std::isnan(id(bus_v).state)) {
                // Correct for this shade's run: the board reads I x R high.
                number::Number *cd[8] = {id(cd0), id(cd1), id(cd2), id(cd3),
                                         id(cd4), id(cd5), id(cd6), id(cd7)};
                float amps = std::isnan(a) ? 0.0f : a;
                id(sess_v) = id(bus_v).state - cd[id(active)]->state * amps;
              }
              if (std::isnan(a)) { id(fault_shade) = id(active); finish(6); id(latch_fault)->execute(2); return; }
              if (id(is_check)) {
                // Check pass: just record the reading. Charging comes after every
                // shade is checked (lowest first); see case 0.
                int p = id(active);
                if (a < 0.05f) id(sess_v) = -1;   // no draw: that's the supply's voltage
                end_check(true);
                id(q_place_auto)->execute(p);
                if (a < 0.05f) snprintf(st, sizeof(st), "%s: checked, no draw", names[p]);
                else snprintf(st, sizeof(st), "%s: checked %.2f V%s", names[p], id(chk_v)[p],
                              id(chk_v)[p] < id(charge_below_v).state ? ", will charge" : ", no charge needed");
                id(status).publish_state(st);
                return;
              }
              if (a < 0.05f) { finish(2); return; }   // under 50 mA: "no draw"
              id(peak_a) = a;
              id(phase) = 2;
              {
                int p = id(active);
                if (id(fit_ok)[p] && id(sess_v) > 0) {
                  float ex = std::max(0.0f, id(fit_a)[p] + id(fit_b)[p] * id(sess_v));
                  snprintf(st, sizeof(st), "%s: expect ~%.2f Ah (start %.2f V)", names[p], ex, id(sess_v));
                  id(expected).publish_state(st);
                }
              }
              return;
            }
            case 2: {  // charging: watch for the taper
              int p = id(active);
              if (std::isnan(a)) { id(fault_shade) = id(active); finish(6); id(latch_fault)->execute(2); return; }
              id(sess_ah) += a * dt_h;
              if (a > id(peak_a)) id(peak_a) = a;
              // The Somfy pack ends its own charge: the current steps from ~0.3 A
              // to 0 at ~13.8 V. Under 60 mA for 2 min = the current has stopped;
              // HOW it stopped decides the result. From the charge current, or
              // below ~13.4 V at the shade, it was the connection (fuse, plug),
              // not a full pack -- the board can't tell once nothing flows.
              number::Number *cd[8] = {id(cd0), id(cd1), id(cd2), id(cd3),
                                       id(cd4), id(cd5), id(cd6), id(cd7)};
              if (a >= 0.06f) {
                id(pre_a) = a;
                if (id(bus_v).has_state() && !std::isnan(id(bus_v).state))
                  id(pre_v) = id(bus_v).state - cd[p]->state * a;
                id(below_since) = 0;
              } else if (id(below_since) == 0) {
                id(below_since) = now;
              } else if (now - id(below_since) >= 120000u) {
                // A pack stops itself near the top (>= 13.4 V at the shade) once its
                // current has already tapered; packs seen stopping at 0.31-0.52 A
                // (higher on the 0.98 A charger). Vanishing at full charge current,
                // or at a low voltage, is the connection, not the pack.
                bool real = id(pre_v) >= 13.4f && id(pre_a) < 0.8f * id(peak_a);
                if (!real) {
                  char m[96];
                  snprintf(m, sizeof(m), "%s: DROPPED OUT at %.2f V / %.2f A - check fuse and plug",
                           names[p], id(pre_v), id(pre_a));
                  ESP_LOGW("charger", "%s", m);
                  finish(7);
                  id(status).publish_state(m);
                } else {
                  finish(1);
                }
                return;
              }
              // Stalled taper: past the bulk (under 80 % of peak) and the current
              // has not moved 10 mA in 30 min -- a long run is holding the pack
              // just short of its own cutoff. Stop instead of running to Max hours.
              if (a < 0.8f * id(peak_a) && a >= 0.06f) {
                if (id(stall_since) == 0 || std::fabs(a - id(stall_a)) > 0.01f) {
                  id(stall_a) = a; id(stall_since) = now;
                } else if (now - id(stall_since) >= 1800000u) {
                  finish(8);
                  return;
                }
              }
              if (now - id(t_start) >= (uint32_t) (id(max_hours).state * 3600000)) { finish(3); return; }
              snprintf(st, sizeof(st), "%s: %.3f A (peak %.3f), %.3f Ah, %u min", names[p], a,
                       id(peak_a), id(sess_ah), (unsigned) ((now - id(t_start)) / 60000u));
              id(status).publish_state(st);
              return;
            }
            case 4: {  // resuming after a pause: let the current settle, then charge on
              if (!std::isnan(a)) id(sess_ah) += a * dt_h;
              if (now - id(t_phase) < 10000) return;
              id(phase) = 2;
              return;
            }
            case 3: {  // gap between ports
              if (now - id(t_phase) < 5000) return;
              id(phase) = 0;
              if (id(qn) == 0 && id(run_mask) == 0 &&
                  !id(halted) && !id(result_shown))
                id(status).publish_state("Idle");
              return;
            }
          }

  # Independent watchdog: catches anything the state machine got wrong.
  - interval: 30s
    then:
      - lambda: |-
          switch_::Switch *ports[8] = {id(relay1), id(relay2), id(relay3), id(relay4),
                                      id(relay5), id(relay6), id(relay7), id(relay8)};
          int on = 0;
          for (auto *s : ports) if (s->state) on++;
          bool overdue = id(active) >= 0 &&
              millis() - id(t_start) > (uint32_t) (id(max_hours).state * 3600000) + 600000u;
          if (on > 1 || (on == 1 && id(active) < 0) || overdue) {
            ESP_LOGE("charger", "watchdog: %d relay(s) on, active=%d, overdue=%d -- all off",
                     on, id(active), overdue);
            for (auto *s : ports) s->turn_off();
            id(fault_shade) = id(active);
            id(active) = -1;
            id(phase) = 0;
            id(latch_fault)->execute(3);
          }
