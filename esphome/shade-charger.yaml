# Somfy battery-shade charger: ESP32 + AEDIKO 8-ch 12 V relay board + INA226.
#
# Charges the 8 Li-ion Somfy shades ONE PORT AT A TIME from a single DC supply,
# and decides on its own when each is done. Everything runs on the ESP32 --
# queue, taper detection, safety cutoffs, schedule -- and the built-in web
# server (http://shade-charger.local) is the UI. Home Assistant is optional: it
# sees the same entities over the native API when it is up, and nothing here
# depends on it.
#
# Charge supply (2026-10-11): a third-party 13.3 V 0.85 A charger -- measured
# 14.0 V open, ~0.98 A into a pack (overcurrent default 1.2 A, fuses 2 A).
# Bench tests used the SOMFY CHARGER itself (labelled 13.3 V 0.65 A; measured
# 13.64 V open, ~0.74 A current-limited, rising to ~13.85 V at the top of charge),
# switched to one shade at a time. Not a plain 12 V PSU -- below the pack's
# 13.3 V, and with no current limit. The 12 V supply only runs the relay coils
# and (via a buck) the XIAO. Defaults below fit it: overcurrent 1.0 A (the
# charger's real output is ~0.74 A to a shade, above its 0.65 A rating), taper
# cutoff 60 mA / 10 % of peak. Shade runs: 16/4 cable, two conductors per leg
# (~0.26 V drop at 0.65 A over 100 ft; the drop shrinks as the charge tapers).
#
# Wiring (see docs/wiring.svg):
#   supply + -> INA226 shunt -> COM1..COM8 (bussed) ; NOn -> fuse -> shade n +
#   supply - -> every shade -
#   Board: Seeed XIAO ESP32-C6. Relay IN1..IN8 = D0 D1 D2 D3 D7 D8 D9 D10
#   (GPIO 0 1 2 21 17 19 20 18); INA226 SDA/SCL = D4/D5 (GPIO 22/23).
#   Relay coils fed from 12 V tapped BEFORE the shunt, or their ~70 mA each reads
#   as charge current. Use the NO contacts only. Set every channel's trigger
#   jumper to HIGH: then a booting/crashed ESP32 leaves all relays open.
#
# How a shade is charged:
#   1. supply check with every relay open, then close its relay, wait 30 s (settle)
#   2. under 50 mA -> "no draw" (full, or a broken connection)
#   3. otherwise charge, tracking peak current and amp-hours delivered, until
#      the pack ends its own charge (current under 60 mA for 2 min) -> "full";
#      or `Max hours` -> "time cap"; or over `Overcurrent` -> stop everything
#      and refuse to continue until "Clear fault"
#   4. 5 s gap, next queued shade
# A CHECK RUN (weekly by default, or "Charge Now") is two passes: first every
# shade gets step 1 only -- read the voltage at the end of Settle, open the relay
# (~6 mAh in), log it; then the shades under `Charge below` are charged, lowest
# voltage first.
# First real charge (2026-10-08, Living Room RIGHT -- logged as Left on relay 1
# and moved over with "Move history"; start of charge unknown):
# 2.27 Ah in 202 min -- 0.74 A flat until ~13.85 V, a ~30 min taper to 0.35 A,
# then the PACK cut itself off (step to 0 A). So "full" is the pack's decision;
# the taper cutoff only has to notice the current is gone.
# Amp-hours delivered per charge is the closest thing to a charge level: it is
# how much the shade USED since last time, and over months shows a tiring pack.
#
# Safety limits, the schedule and "Charge below" are UI numbers (persisted). The
# end-of-charge detection is fixed: the pack ends its own charge, so there is
# nothing to tune there.

substitutions:
  name: shade-charger
  # The eight shades, by slot. Renaming one = change it here and reflash: every
  # button, sensor, setting, dropdown and status line uses these. History,
  # learned data and settings belong to the SLOT, so they survive a rename
  # (HA gives the renamed entities new IDs).
  # Local time zone (IANA name) for the Auto Charge Start/Stop hours and dates.
  timezone: America/New_York
  shade1: Living Room Left
  shade2: Living Room Center
  shade3: Living Room Right
  shade4: Living Room North
  shade5: Den
  shade6: Bedroom 2 Left
  shade7: Bedroom 2 Right
  shade8: Bedroom 3
  # INA226 full scale is 81.92 mV across the shunt. The module is an MJKDZ
  # INA226 with an R002 shunt (0.002 ohm, read off the board 2026-10-08): ~41 A
  # full scale, and the chip's 2.5 uV shunt step makes its resolution ~1.25 mA.
  # Workable for a 50-60 mA taper cutoff (adc_averaging smooths it); swapping
  # the 2512 shunt for an R010/R020 would give 5-10x finer steps if the taper
  # reads noisy. max_current is set to 4 A, not 41: the current register's
  # LSB is max_current / 2^15, so a lower ceiling gives finer current steps.
  shunt_ohms: "0.002"
  shunt_max_a: "4.0"

esphome:
  name: ${name}
  friendly_name: Shade Charger
  min_version: 2025.11.0
  on_boot:
    # XIAO ESP32-C6 RF switch, as early as possible: GPIO3 low enables it,
    # GPIO14 low selects the built-in ceramic antenna (high = U.FL). Seeed's
    # Arduino core drives these; an ESP-IDF build leaves them floating, which
    # cost ~24 dB on this board family (-75 dBm floating vs -51 dBm driven).
    # The switch entries below hold them low from then on.
    - priority: 800
      then:
        - switch.turn_off: rf_switch_enable
        - switch.turn_off: rf_antenna_ext
    - priority: -100
      then:
        - lambda: |-
            for (int p = 0; p < 8; p++) id(learn_update)->execute(p);
            for (int p = 0; p < 8; p++) id(port_summary_update)->execute(p);
            id(last_run).publish_state(id(last_run_txt)[0] ? std::string(id(last_run_txt).data()) : "no check run yet");
            if (id(qn) < 0 || id(qn) > 16) id(qn) = 0;
            id(q_publish)->execute();
            id(next_check_update)->execute();
            if (id(halted)) id(latch_fault)->execute(id(fault_code)); else id(status).publish_state("Idle");

# Seeed XIAO ESP32-C6. 11 GPIOs on the headers: 8 relays + I2C use 10 of them.
# D6 (GPIO16) is deliberately left free: it is UART0 TX and prints the ROM boot
# log, which would chatter a relay on every boot.
esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf

logger:

# Why the board last restarted (power-on / brownout / panic / watchdog / OTA).
# Added 2026-10-11 after unexplained restarts, one mid-charge: a brownout
# points at the 12 V supply or its wiring, a panic at the firmware.
debug:
  update_interval: never

api:
  encryption:
    key: !secret charger_api_key

ota:
  # Over Wi-Fi from ESPHome (CLI / dashboard), password-protected.
  - platform: esphome
    password: !secret charger_ota_password
  # And from the charger's own page: an "OTA Update" box that takes a .bin,
  # behind the same login as the rest of the page.
  - platform: web_server

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80
  version: 3
  # One-row-per-shade table above the standard sections (live, from /events).
  js_include: shade-charger-table.js
  # The page is grouped: live sensors first, then controls, then each shade's
  # last charge, with the tuning numbers last.
  sorting_groups:
    - { id: g_now, name: "Now", sorting_weight: 10 }
    - { id: g_control, name: "All shades", sorting_weight: 20 }
    - { id: g_one, name: "Charge one shade", sorting_weight: 25 }
    - { id: g_last, name: "Last charge per shade", sorting_weight: 30 }
    - { id: g_learn, name: "Learned per shade", sorting_weight: 35 }
    - { id: g_settings, name: "Settings", sorting_weight: 40 }
    - { id: g_wiring, name: "Wiring", sorting_weight: 50 }
    - { id: g_cable, name: "Cable resistance per shade", sorting_weight: 55 }
    - { id: g_move, name: "Move history", sorting_weight: 60 }
  auth:
    username: !secret charger_web_username
    password: !secret charger_web_password

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    on_time_sync:
      - script.execute: next_check_update
    on_time:
      # Hourly: start a scheduled run if one is due.
      - minutes: 0
        seconds: 0
        then:
          # The "now ~N %" estimate moves with time, so refresh it hourly.
          - lambda: "for (int p = 0; p < 8; p++) id(learn_update)->execute(p);"
          # Waiting entries say "from HH:00" outside the window; refresh hourly.
          - lambda: "id(q_publish)->execute(); id(next_check_update)->execute();"
          # Rebuild each shade's last-charge line from the saved data (a line was
          # once seen cut short on the device while HA had it whole).
          - lambda: "for (int p = 0; p < 8; p++) id(port_summary_update)->execute(p);"
          - lambda: |-
              int days = (int) id(auto_days).state;   // "Auto check every"
              auto t = id(sntp_time).now();
              if (days <= 0 || !t.is_valid() || id(halted)) return;
              if (t.hour != (int) id(auto_hour).state) return;
              if (t.timestamp - id(last_auto) < (uint32_t) days * 86400u - 3600u) return;
              id(last_auto) = t.timestamp;
              id(next_check_update)->execute();
              id(run_manual) = false;
              for (int p = 0; p < 8; p++) id(q_add)->execute(p, 1);
              id(run_mask) = 0xFF;
              ESP_LOGI("charger", "scheduled check: all shades queued");

i2c:
  sda: GPIO22   # XIAO D4
  scl: GPIO23   # XIAO D5

sensor:
  - platform: ina226
    address: 0x40
    shunt_resistance: ${shunt_ohms} ohm
    max_current: ${shunt_max_a} A
    adc_averaging: 64
    update_interval: 1s
    current:
      name: "Charge current"
      id: cur_a
      web_server: { sorting_group_id: g_now, sorting_weight: 2 }
      accuracy_decimals: 3
    bus_voltage:
      name: "Charge voltage"
      id: bus_v
      web_server: { sorting_group_id: g_now, sorting_weight: 3 }
      accuracy_decimals: 2
  - platform: template
    name: "Session delivered"
    web_server: { sorting_group_id: g_now, sorting_weight: 4 }
    id: session_ah
    unit_of_measurement: "Ah"
    accuracy_decimals: 3
    lambda: "return id(sess_ah);"
    update_interval: 10s

globals:
  # --- live state (not persisted) ---
  # Shades queued for a CHECK: 30 s in, read the voltage; charge on only if it
  # is under "Charge below", else stop (~6 mAh in, nothing recorded as a charge).
  # THE QUEUE: one ordered list that both drives the work and is shown ("Queue").
  # Entry i = shade qs[i], kind qk[i]: 0 manual charge (runs any time), 1 check
  # (30 s reading, any time), 2 automatic charge (only inside the charge window:
  # Auto check hour .. Charge until hour). Kept across reboots, so charges waiting
  # for tomorrow's window survive a power cut.
  - { id: qs, type: "std::array<int8_t, 16>", restore_value: true, initial_value: "std::array<int8_t, 16>{}" }
  - { id: qk, type: "std::array<uint8_t, 16>", restore_value: true, initial_value: "std::array<uint8_t, 16>{}" }
  - { id: qn, type: int, restore_value: true, initial_value: "0" }
  - { id: active_kind, type: int, initial_value: "0" }
  # A check run in progress: which shades it covers. When the run's last check
  # is done, the ones under "Charge below" are queued, lowest voltage first.
  - { id: run_mask, type: uint8_t, restore_value: true, initial_value: "0" }
  # The last check run's summary, kept across reboots (plain char array so it can
  # be restored) and shown as "Last check run".
  - { id: last_run_txt, type: "std::array<char, 200>", restore_value: true, initial_value: "std::array<char, 200>{}" }
  - { id: is_check, type: bool, initial_value: "false" }
  - { id: active, type: int, initial_value: "-1" }
  - { id: phase, type: int, initial_value: "0" }      # 0 idle, 1 settle, 2 charge, 3 gap, 4 resuming
  - { id: t_start, type: uint32_t, initial_value: "0" }
  - { id: t_phase, type: uint32_t, initial_value: "0" }
  - { id: last_tick, type: uint32_t, initial_value: "0" }
  - { id: peak_a, type: float, initial_value: "0" }
  - { id: below_since, type: uint32_t, initial_value: "0" }
  # The last run's result is on the Status line; keep it there (rather than
  # "Idle") until the next run starts, so a 30 s "no draw" can't be missed.
  - { id: result_shown, type: bool, initial_value: "false" }
  # Pause (a Somfy motor won't move while its charger is connected): relay open,
  # the run frozen, auto-resume at pause_until. Set by the "Pause charging" switch,
  # which HA turns on just before re-sending a move to the shade being charged.
  - { id: paused, type: bool, initial_value: "false" }
  - { id: was_paused, type: bool, initial_value: "false" }
  - { id: pause_until, type: uint32_t, initial_value: "0" }
  - { id: pause_t0, type: uint32_t, initial_value: "0" }
  - { id: active_relay, type: int, initial_value: "-1" }
  # Last reading while the pack was still drawing (>= 60 mA): how the current
  # STOPPED tells a real finish (~0.3 A at ~13.8 V) from a lost connection.
  - { id: pre_a, type: float, initial_value: "0" }
  - { id: pre_v, type: float, initial_value: "0" }
  # Stall detection in the taper: current not moving for 30 min.
  - { id: stall_a, type: float, initial_value: "0" }
  - { id: stall_since, type: uint32_t, initial_value: "0" }
  - { id: sess_ah, type: float, initial_value: "0" }
  - { id: stop_req, type: bool, initial_value: "false" }
  # --- persisted across reboots ---
  - { id: halted, type: bool, restore_value: true, initial_value: "false" }
  # Why we are halted, shown in Status (survives a reboot along with halted).
  - { id: fault_code, type: uint8_t, restore_value: true, initial_value: "0" }
  # Which shade the fault happened on (-1 = the charger itself: supply voltage).
  - { id: fault_shade, type: int, restore_value: true, initial_value: "-1" }  # 1 overcurrent, 2 sensor, 3 watchdog, 4 supply low, 5 supply high
  - { id: last_auto, type: uint32_t, restore_value: true, initial_value: "0" }
  # Stop holds the queue (nothing new starts) until Charge Now or a shade's own
  # Charge button. Kept across reboots.
  - { id: held, type: bool, restore_value: true, initial_value: "false" }
  # The check run in progress was started by Charge Now: its charges run at once
  # (manual), instead of waiting for the Auto Charge window.
  - { id: run_manual, type: bool, restore_value: true, initial_value: "false" }
  - { id: check_front, type: bool, initial_value: "false" }
  - { id: last_epoch, type: "std::array<uint32_t, 8>", restore_value: true, initial_value: "std::array<uint32_t, 8>{}" }
  - { id: last_ah, type: "std::array<float, 8>", restore_value: true, initial_value: "std::array<float, 8>{}" }
  - { id: last_min, type: "std::array<uint16_t, 8>", restore_value: true, initial_value: "std::array<uint16_t, 8>{}" }
  # Voltage at the end of Settle, with the pack drawing. Logged to see whether it
  # predicts how much the pack then takes (state of charge is otherwise unknown).
  - { id: last_v, type: "std::array<float, 8>", restore_value: true, initial_value: "std::array<float, 8>{}" }
  # Voltage at the shade when an unfinished charge ended (stopped, time cap,
  # dropped out, window end): the newest reading for the battery estimate.
  - { id: last_endv, type: "std::array<float, 8>", restore_value: true, initial_value: "std::array<float, 8>{}" }
  - { id: sess_v, type: float, initial_value: "0" }
  # 0 never, 1 full, 2 no draw, 3 time cap, 4 overcurrent, 5 stopped, 6 sensor fault,
  # 7 dropped out (current vanished mid-charge), 8 full, cable-limited (stalled taper),
  # 9 stopped at the end of the charge window (re-queued)
  - { id: last_res, type: "std::array<uint8_t, 8>", restore_value: true, initial_value: "std::array<uint8_t, 8>{}" }
  # --- per-shade history: the last 8 charges of each shade, a ring per shade ---
  # Record k of shade p lives at index p*8 + k; h_head[p] is the next slot to
  # write, i.e. the oldest record once the ring is full. Epoch 0 = empty slot.
  # "no draw" and "stopped" runs that delivered nothing are not recorded, so
  # they cannot push real charges out of the ring.
  - { id: h_epoch, type: "std::array<uint32_t, 64>", restore_value: true, initial_value: "std::array<uint32_t, 64>{}" }
  - { id: h_ah, type: "std::array<float, 64>", restore_value: true, initial_value: "std::array<float, 64>{}" }
  - { id: h_v, type: "std::array<float, 64>", restore_value: true, initial_value: "std::array<float, 64>{}" }
  - { id: h_min, type: "std::array<uint16_t, 64>", restore_value: true, initial_value: "std::array<uint16_t, 64>{}" }
  - { id: h_res, type: "std::array<uint8_t, 64>", restore_value: true, initial_value: "std::array<uint8_t, 64>{}" }
  - { id: h_head, type: "std::array<uint8_t, 8>", restore_value: true, initial_value: "std::array<uint8_t, 8>{}" }
  # Latest check per shade (separate from the charge history, so weekly checks
  # never push real charges out of the 8-deep ring).
  - { id: chk_epoch, type: "std::array<uint32_t, 8>", restore_value: true, initial_value: "std::array<uint32_t, 8>{}" }
  - { id: chk_v, type: "std::array<float, 8>", restore_value: true, initial_value: "std::array<float, 8>{}" }
  # Learned start-voltage -> Ah line per shade (recomputed from history, not stored).
  - { id: fit_ok, type: "std::array<bool, 8>", initial_value: "std::array<bool, 8>{}" }
  - { id: fit_a, type: "std::array<float, 8>", initial_value: "std::array<float, 8>{}" }
  - { id: fit_b, type: "std::array<float, 8>", initial_value: "std::array<float, 8>{}" }

# Relays are internal: nothing -- not the UI, not HA -- can close one except the
# charging logic below, so every path goes through its cutoffs.
switch:
  - platform: template
    name: "Pause charging"
    id: pause_sw
    icon: mdi:pause-circle-outline
    web_server: { sorting_group_id: g_control, sorting_weight: 6 }
    lambda: "return id(paused);"
    turn_on_action:
      - lambda: |-
          id(paused) = true;
          id(pause_until) = millis() + (uint32_t) (id(pause_min).state * 60000);
    turn_off_action:
      - lambda: "id(paused) = false;"
  # XIAO ESP32-C6 antenna switch -- see on_boot. Not relays; internal, held low.
  - { platform: gpio, id: rf_switch_enable, pin: GPIO3, internal: true, restore_mode: ALWAYS_OFF }
  - { platform: gpio, id: rf_antenna_ext, pin: GPIO14, internal: true, restore_mode: ALWAYS_OFF }
  - { platform: gpio, id: relay1, pin: GPIO0, internal: true, restore_mode: ALWAYS_OFF, interlock: [relay2, relay3, relay4, relay5, relay6, relay7, relay8], interlock_wait_time: 500ms }
  - { platform: gpio, id: relay2, pin: GPIO1, internal: true, restore_mode: ALWAYS_OFF, interlock: [relay1, relay3, relay4, relay5, relay6, relay7, relay8], interlock_wait_time: 500ms }
  - { platform: gpio, id: relay3, pin: GPIO2, internal: true, restore_mode: ALWAYS_OFF, interlock: [relay1, relay2, relay4, relay5, relay6, relay7, relay8], interlock_wait_time: 500ms }
  - { platform: gpio, id: relay4, pin: GPIO21, internal: true, restore_mode: ALWAYS_OFF, interlock: [relay1, relay2, relay3, relay5, relay6, relay7, relay8], interlock_wait_time: 500ms }
  - { platform: gpio, id: relay5, pin: GPIO17, internal: true, restore_mode: ALWAYS_OFF, interlock: [relay1, relay2, relay3, relay4, relay6, relay7, relay8], interlock_wait_time: 500ms }
  - { platform: gpio, id: relay6, pin: GPIO19, internal: true, restore_mode: ALWAYS_OFF, interlock: [relay1, relay2, relay3, relay4, relay5, relay7, relay8], interlock_wait_time: 500ms }
  - { platform: gpio, id: relay7, pin: GPIO20, internal: true, restore_mode: ALWAYS_OFF, interlock: [relay1, relay2, relay3, relay4, relay5, relay6, relay8], interlock_wait_time: 500ms }
  - { platform: gpio, id: relay8, pin: GPIO18, internal: true, restore_mode: ALWAYS_OFF, interlock: [relay1, relay2, relay3, relay4, relay5, relay6, relay7], interlock_wait_time: 500ms }

number:
  - { platform: template, name: "Max hours per shade", web_server: { sorting_group_id: g_settings, sorting_weight: 3 }, id: max_hours, unit_of_measurement: h, min_value: 0.5, max_value: 24, step: 0.5, initial_value: 8, optimistic: true, restore_value: true, entity_category: config }
  - { platform: template, name: "Overcurrent", web_server: { sorting_group_id: g_settings, sorting_weight: 4 }, id: overcurrent_a, unit_of_measurement: A, min_value: 0.1, max_value: 8, step: 0.1, initial_value: 1.2, optimistic: true, restore_value: true, entity_category: config }
  # Supply check, made with every relay open (under load the supply sags to the
  # pack voltage, so these limits only apply before a port is switched in).
  - { platform: template, name: "Supply min", web_server: { sorting_group_id: g_settings, sorting_weight: 10 }, id: supply_min_v, unit_of_measurement: V, min_value: 9, max_value: 15, step: 0.1, initial_value: 12.5, optimistic: true, restore_value: true, entity_category: config }
  - { platform: template, name: "Supply max", web_server: { sorting_group_id: g_settings, sorting_weight: 11 }, id: supply_max_v, unit_of_measurement: V, min_value: 12, max_value: 20, step: 0.1, initial_value: 14.5, optimistic: true, restore_value: true, entity_category: config }
  # A check charges on only below this voltage (read 30 s in, pack drawing).
  # First packs: 12.26 V -> 2.27 Ah, 13.20 V -> 0.83 Ah, 13.67 V -> 0.03 Ah (full).
  - { platform: template, name: "Pause minutes", web_server: { sorting_group_id: g_settings, sorting_weight: 4 }, id: pause_min, unit_of_measurement: min, min_value: 1, max_value: 15, step: 1, initial_value: 2, optimistic: true, restore_value: true, entity_category: config }
  - { platform: template, name: "Charge below", web_server: { sorting_group_id: g_settings, sorting_weight: 3 }, id: charge_below_v, unit_of_measurement: V, min_value: 11, max_value: 14.5, step: 0.05, initial_value: 13.4, optimistic: true, restore_value: true, entity_category: config }
  # Per-shade run resistance (cable + fuse + relay + joints, out and back). The
  # board measures voltage BEFORE the run, so a shade's voltage reads high by
  # I x R. Measure once while charging: (charger "Charge voltage" - meter at the
  # shade end) / "Charge current". Start voltages, "Charge below" and the
  # dropped-out check use the corrected value; works with any charger current.
  - { platform: template, name: "Cable resistance ${shade1}", id: cd0, unit_of_measurement: "Ω", min_value: 0, max_value: 3, step: 0.01, initial_value: 0, optimistic: true, restore_value: true, entity_category: config, web_server: { sorting_group_id: g_cable, sorting_weight: 1 } }
  - { platform: template, name: "Cable resistance ${shade2}", id: cd1, unit_of_measurement: "Ω", min_value: 0, max_value: 3, step: 0.01, initial_value: 0, optimistic: true, restore_value: true, entity_category: config, web_server: { sorting_group_id: g_cable, sorting_weight: 2 } }
  - { platform: template, name: "Cable resistance ${shade3}", id: cd2, unit_of_measurement: "Ω", min_value: 0, max_value: 3, step: 0.01, initial_value: 0, optimistic: true, restore_value: true, entity_category: config, web_server: { sorting_group_id: g_cable, sorting_weight: 3 } }
  - { platform: template, name: "Cable resistance ${shade4}", id: cd3, unit_of_measurement: "Ω", min_value: 0, max_value: 3, step: 0.01, initial_value: 0, optimistic: true, restore_value: true, entity_category: config, web_server: { sorting_group_id: g_cable, sorting_weight: 4 } }
  - { platform: template, name: "Cable resistance ${shade5}", id: cd4, unit_of_measurement: "Ω", min_value: 0, max_value: 3, step: 0.01, initial_value: 0, optimistic: true, restore_value: true, entity_category: config, web_server: { sorting_group_id: g_cable, sorting_weight: 5 } }
  - { platform: template, name: "Cable resistance ${shade6}", id: cd5, unit_of_measurement: "Ω", min_value: 0, max_value: 3, step: 0.01, initial_value: 0, optimistic: true, restore_value: true, entity_category: config, web_server: { sorting_group_id: g_cable, sorting_weight: 6 } }
  - { platform: template, name: "Cable resistance ${shade7}", id: cd6, unit_of_measurement: "Ω", min_value: 0, max_value: 3, step: 0.01, initial_value: 0, optimistic: true, restore_value: true, entity_category: config, web_server: { sorting_group_id: g_cable, sorting_weight: 7 } }
  - { platform: template, name: "Cable resistance ${shade8}", id: cd7, unit_of_measurement: "Ω", min_value: 0, max_value: 3, step: 0.01, initial_value: 0, optimistic: true, restore_value: true, entity_category: config, web_server: { sorting_group_id: g_cable, sorting_weight: 8 } }
  - { platform: template, name: "Auto check every", web_server: { sorting_group_id: g_settings, sorting_weight: 1 }, id: auto_days, unit_of_measurement: days, min_value: 0, max_value: 90, step: 1, initial_value: 7, optimistic: true, restore_value: true, entity_category: config, on_value: { then: [ { script.execute: next_check_update } ] } }
  - { platform: template, name: "Auto Charge Stop", web_server: { sorting_group_id: g_settings, sorting_weight: 2 }, id: until_hour, unit_of_measurement: h, min_value: 0, max_value: 23, step: 1, initial_value: 8, optimistic: true, restore_value: true, entity_category: config }
  - { platform: template, name: "Auto Charge Start", web_server: { sorting_group_id: g_settings, sorting_weight: 2 }, id: auto_hour, unit_of_measurement: h, min_value: 0, max_value: 23, step: 1, initial_value: 2, optimistic: true, restore_value: true, entity_category: config, on_value: { then: [ { script.execute: next_check_update } ] } }

select:
  # Which shade is wired to each relay. History follows the SHADE, so a shade
  # can move to another relay without mixing up its charge records. If two
  # relays name the same shade, the lower-numbered relay is used.
  - { platform: template, name: "Relay 1 shade", id: rs1, options: ["(none)", "${shade1}", "${shade2}", "${shade3}", "${shade4}", "${shade5}", "${shade6}", "${shade7}", "${shade8}"], initial_option: "${shade1}", optimistic: true, restore_value: true, entity_category: config, web_server: { sorting_group_id: g_wiring, sorting_weight: 1 } }
  - { platform: template, name: "Relay 2 shade", id: rs2, options: ["(none)", "${shade1}", "${shade2}", "${shade3}", "${shade4}", "${shade5}", "${shade6}", "${shade7}", "${shade8}"], initial_option: "${shade2}", optimistic: true, restore_value: true, entity_category: config, web_server: { sorting_group_id: g_wiring, sorting_weight: 2 } }
  - { platform: template, name: "Relay 3 shade", id: rs3, options: ["(none)", "${shade1}", "${shade2}", "${shade3}", "${shade4}", "${shade5}", "${shade6}", "${shade7}", "${shade8}"], initial_option: "${shade3}", optimistic: true, restore_value: true, entity_category: config, web_server: { sorting_group_id: g_wiring, sorting_weight: 3 } }
  - { platform: template, name: "Relay 4 shade", id: rs4, options: ["(none)", "${shade1}", "${shade2}", "${shade3}", "${shade4}", "${shade5}", "${shade6}", "${shade7}", "${shade8}"], initial_option: "${shade4}", optimistic: true, restore_value: true, entity_category: config, web_server: { sorting_group_id: g_wiring, sorting_weight: 4 } }
  - { platform: template, name: "Relay 5 shade", id: rs5, options: ["(none)", "${shade1}", "${shade2}", "${shade3}", "${shade4}", "${shade5}", "${shade6}", "${shade7}", "${shade8}"], initial_option: "${shade5}", optimistic: true, restore_value: true, entity_category: config, web_server: { sorting_group_id: g_wiring, sorting_weight: 5 } }
  - { platform: template, name: "Relay 6 shade", id: rs6, options: ["(none)", "${shade1}", "${shade2}", "${shade3}", "${shade4}", "${shade5}", "${shade6}", "${shade7}", "${shade8}"], initial_option: "${shade6}", optimistic: true, restore_value: true, entity_category: config, web_server: { sorting_group_id: g_wiring, sorting_weight: 6 } }
  - { platform: template, name: "Relay 7 shade", id: rs7, options: ["(none)", "${shade1}", "${shade2}", "${shade3}", "${shade4}", "${shade5}", "${shade6}", "${shade7}", "${shade8}"], initial_option: "${shade7}", optimistic: true, restore_value: true, entity_category: config, web_server: { sorting_group_id: g_wiring, sorting_weight: 7 } }
  - { platform: template, name: "Relay 8 shade", id: rs8, options: ["(none)", "${shade1}", "${shade2}", "${shade3}", "${shade4}", "${shade5}", "${shade6}", "${shade7}", "${shade8}"], initial_option: "${shade8}", optimistic: true, restore_value: true, entity_category: config, web_server: { sorting_group_id: g_wiring, sorting_weight: 8 } }
  # Fixing a mislabelled charge: move one shade's records onto another.
  - { platform: template, name: "Move history from", id: mv_from, options: ["${shade1}", "${shade2}", "${shade3}", "${shade4}", "${shade5}", "${shade6}", "${shade7}", "${shade8}"], initial_option: "${shade1}", optimistic: true, entity_category: config, web_server: { sorting_group_id: g_move, sorting_weight: 1 } }
  - { platform: template, name: "Move history to", id: mv_to, options: ["${shade1}", "${shade2}", "${shade3}", "${shade4}", "${shade5}", "${shade6}", "${shade7}", "${shade8}"], initial_option: "${shade1}", optimistic: true, entity_category: config, web_server: { sorting_group_id: g_move, sorting_weight: 2 } }

button:
  # Moves the last-charge line, the 8-charge history and so the learned line
  # from "Move history from" to "Move history to"; the target's own records are
  # replaced and the source is left as never charged. Refused mid-charge.
  - platform: template
    name: "Move history"
    entity_category: config
    web_server: { sorting_group_id: g_move, sorting_weight: 3 }
    on_press:
      - lambda: |-
          auto fi = id(mv_from)->active_index(), ti = id(mv_to)->active_index();
          if (!fi.has_value() || !ti.has_value()) return;
          int a = *fi, b = *ti;
          if (a == b) { id(status).publish_state("Move history: from and to are the same shade"); return; }
          if (id(active) >= 0 || id(qn) > 0) { id(status).publish_state("Move history: refused while charging"); return; }
          id(last_epoch)[b] = id(last_epoch)[a]; id(last_epoch)[a] = 0;
          id(last_ah)[b] = id(last_ah)[a];       id(last_ah)[a] = 0;
          id(last_min)[b] = id(last_min)[a];     id(last_min)[a] = 0;
          id(last_res)[b] = id(last_res)[a];     id(last_res)[a] = 0;
          id(last_v)[b] = id(last_v)[a];         id(last_v)[a] = 0;
          for (int k = 0; k < 8; k++) {
            int i = a * 8 + k, j = b * 8 + k;
            id(h_epoch)[j] = id(h_epoch)[i]; id(h_epoch)[i] = 0;
            id(h_ah)[j] = id(h_ah)[i];       id(h_ah)[i] = 0;
            id(h_v)[j] = id(h_v)[i];         id(h_v)[i] = 0;
            id(h_min)[j] = id(h_min)[i];     id(h_min)[i] = 0;
            id(h_res)[j] = id(h_res)[i];     id(h_res)[i] = 0;
          }
          id(h_head)[b] = id(h_head)[a]; id(h_head)[a] = 0;
          for (int p : {a, b}) { id(port_summary_update)->execute(p); id(learn_update)->execute(p); }
          ESP_LOGI("charger", "history moved: shade %d -> %d", a, b);
          id(status).publish_state("History moved");
  - platform: template
    name: "Clear queue"
    icon: mdi:playlist-remove
    web_server: { sorting_group_id: g_control, sorting_weight: 7 }
    on_press:
      - lambda: |-
          id(qn) = 0; id(run_mask) = 0; id(held) = false;
          id(q_publish)->execute();
          if (id(active) < 0) { id(status).publish_state("Queue cleared"); id(result_shown) = true; }
  # Charge Now: release a held queue, make any waiting automatic charges run now,
  # check every shade first, then charge the ones under "Charge below", lowest
  # voltage first, right away (ignores the Auto Charge window). Restarts the
  # weekly clock.
  - platform: template
    name: "Charge Now"
    icon: mdi:battery-charging-high
    web_server: { sorting_group_id: g_control, sorting_weight: 1 }
    on_press:
      - lambda: |-
          if (id(halted)) return;
          id(held) = false;
          for (int i = 0; i < id(qn); i++) if (id(qk)[i] == 2) id(qk)[i] = 0;
          if (id(active) >= 0 && id(active_kind) == 2) id(active_kind) = 0;
          id(run_manual) = true;
          id(check_front) = true;
          for (int p = 0; p < 8; p++) id(q_add)->execute(p, 1);
          id(check_front) = false;
          id(run_mask) = 0xFF;
          auto t = id(sntp_time).now();
          if (t.is_valid()) id(last_auto) = t.timestamp;
          id(next_check_update)->execute();
  - { platform: template, name: "Stop", web_server: { sorting_group_id: g_control, sorting_weight: 2 }, on_press: { lambda: "id(stop_req) = true;" } }
  - platform: template
    name: "Clear fault"
    web_server: { sorting_group_id: g_control, sorting_weight: 5 }
    on_press:
      - lambda: |-
          id(halted) = false;
          id(fault_code) = 0;
          id(fault_shade) = -1;
          id(status).publish_state("Idle");
  - { platform: template, name: "Charge ${shade1}", web_server: { sorting_group_id: g_one, sorting_weight: 1 }, on_press: { lambda: "if (!id(halted)) { id(held) = false; id(q_add)->execute(0, 0); }" } }
  - { platform: template, name: "Charge ${shade2}", web_server: { sorting_group_id: g_one, sorting_weight: 2 }, on_press: { lambda: "if (!id(halted)) { id(held) = false; id(q_add)->execute(1, 0); }" } }
  - { platform: template, name: "Charge ${shade3}", web_server: { sorting_group_id: g_one, sorting_weight: 3 }, on_press: { lambda: "if (!id(halted)) { id(held) = false; id(q_add)->execute(2, 0); }" } }
  - { platform: template, name: "Charge ${shade4}", web_server: { sorting_group_id: g_one, sorting_weight: 4 }, on_press: { lambda: "if (!id(halted)) { id(held) = false; id(q_add)->execute(3, 0); }" } }
  - { platform: template, name: "Charge ${shade5}", web_server: { sorting_group_id: g_one, sorting_weight: 5 }, on_press: { lambda: "if (!id(halted)) { id(held) = false; id(q_add)->execute(4, 0); }" } }
  - { platform: template, name: "Charge ${shade6}", web_server: { sorting_group_id: g_one, sorting_weight: 6 }, on_press: { lambda: "if (!id(halted)) { id(held) = false; id(q_add)->execute(5, 0); }" } }
  - { platform: template, name: "Charge ${shade7}", web_server: { sorting_group_id: g_one, sorting_weight: 7 }, on_press: { lambda: "if (!id(halted)) { id(held) = false; id(q_add)->execute(6, 0); }" } }
  - { platform: template, name: "Charge ${shade8}", web_server: { sorting_group_id: g_one, sorting_weight: 8 }, on_press: { lambda: "if (!id(halted)) { id(held) = false; id(q_add)->execute(7, 0); }" } }

